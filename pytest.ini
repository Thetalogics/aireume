[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    external: live LLM/provider integration; excluded from the default hermetic suite
timeout = 30
timeout_method = thread
