name: CD - Build & Push Images

on:
  workflow_run:
    workflows: [CI - Test on Pull Request]
    types: [completed]
    branches: [main, production]
  # Manual dispatch is limited to staging rebuilds. Production images are built
  # only from a successful CI workflow_run and promoted by immutable digest.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
        default: staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Determine image tag based on branch ───────────────────────────────
  resolve-tag:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      environment: ${{ steps.tag.outputs.environment }}
      release_sha: ${{ steps.tag.outputs.release_sha }}
    steps:
      - name: Verify workflow_run source
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          test "$SOURCE_CONCLUSION" = "success"
          test "$SOURCE_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$SOURCE_WORKFLOW" = "CI - Test on Pull Request"

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
            if [ "$ENV" = "production" ]; then
              echo "Manual production CD is disabled. Production requires successful CI workflow_run evidence." >&2
              exit 1
            fi
            RELEASE_SHA="${{ github.sha }}"
            RELEASE_BRANCH="${{ github.ref_name }}"
          else
            RELEASE_SHA="${{ github.event.workflow_run.head_sha }}"
            RELEASE_BRANCH="${{ github.event.workflow_run.head_branch }}"

            if [ "$RELEASE_BRANCH" = "production" ]; then
              ENV="production"
            else
              ENV="staging"
            fi
          fi

          if [ "$ENV" = "production" ]; then
            echo "image_tag=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=staging" >> "$GITHUB_OUTPUT"
          fi

          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Branch: ${RELEASE_BRANCH} → Environment: $ENV → SHA: ${RELEASE_SHA}"

  # ─── Build and push images ─────────────────────────────────────────────
  build-and-push:
    needs: [resolve-tag]
    runs-on: ubuntu-latest
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      nginx_digest: ${{ steps.nginx.outputs.digest }}
      livekit_digest: ${{ steps.livekit.outputs.digest }}
      speech_service_digest: ${{ steps.speech-service.outputs.digest }}
      voice_agent_digest: ${{ steps.voice-agent.outputs.digest }}
    env:
      IMAGE_TAG: ${{ needs.resolve-tag.outputs.image_tag }}
      RELEASE_SHA: ${{ needs.resolve-tag.outputs.release_sha }}
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ env.RELEASE_SHA }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

    - name: Login to Docker Hub
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push backend
      id: backend
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: .
        file: ./app/backend/Dockerfile
        push: true
        tags: |
          ${{ env.DH_USER }}/resume-backend:${{ env.RELEASE_SHA }}
          ${{ env.DH_USER }}/resume-backend:${{ env.IMAGE_TAG }}
        build-args: |
          BUILD_ID=${{ env.RELEASE_SHA }}
          GIT_SHA=${{ env.RELEASE_SHA }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        sbom: true
        provenance: true

    - name: Build and push frontend
      id: frontend
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: ./app/frontend
        push: true
        tags: |
          ${{ env.DH_USER }}/resume-frontend:${{ env.RELEASE_SHA }}
          ${{ env.DH_USER }}/resume-frontend:${{ env.IMAGE_TAG }}
        build-args: |
          BUILD_ID=${{ env.RELEASE_SHA }}
          GIT_SHA=${{ env.RELEASE_SHA }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false

    - name: Build and push nginx
      id: nginx
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: ./nginx
        push: true
        tags: |
          ${{ env.DH_USER }}/resume-nginx:${{ env.RELEASE_SHA }}
          ${{ env.DH_USER }}/resume-nginx:${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false

    - name: Build and push livekit
      id: livekit
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: .
        file: ./app/voice_agent/Dockerfile.livekit
        push: true
        tags: |
          ${{ env.DH_USER }}/resume-livekit:${{ env.RELEASE_SHA }}
          ${{ env.DH_USER }}/resume-livekit:${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false

    - name: Build and push speech-service
      id: speech-service
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: .
        file: ./app/speech_service/Dockerfile
        push: true
        tags: |
          ${{ env.DH_USER }}/resume-speech-service:${{ env.RELEASE_SHA }}
          ${{ env.DH_USER }}/resume-speech-service:${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false

    - name: Build and push voice-agent
      id: voice-agent
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
      with:
        context: .
        file: ./app/voice_agent/Dockerfile
        push: true
        tags: |
          ${{ env.DH_USER }}/resume-voice-agent:${{ env.RELEASE_SHA }}
          ${{ env.DH_USER }}/resume-voice-agent:${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false

  deploy-staging:
    needs: [resolve-tag, build-and-push]
    uses: ./.github/workflows/deploy-staging.yml
    with:
      target_environment: ${{ needs.resolve-tag.outputs.environment }}
      expected_sha: ${{ needs.resolve-tag.outputs.release_sha }}
    secrets: inherit

  # Main builds are exercised only after explicit staging reconciliation. For
  # production promotion, staging must already report that exact SHA. CI also
  # runs hermetic real-backend E2E for every protected-branch push.
  authenticated-staging-e2e:
    needs: [resolve-tag, build-and-push, deploy-staging]
    uses: ./.github/workflows/e2e-staging.yml
    with:
      expected_sha: ${{ needs.resolve-tag.outputs.release_sha }}
    secrets: inherit

  # ─── Summary ────────────────────────────────────────────────────────────
  deploy-summary:
    needs: [resolve-tag, build-and-push, deploy-staging, authenticated-staging-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable release manifest
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          RELEASE_SHA: ${{ needs.resolve-tag.outputs.release_sha }}
          BACKEND_DIGEST: ${{ needs.build-and-push.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.build-and-push.outputs.frontend_digest }}
          NGINX_DIGEST: ${{ needs.build-and-push.outputs.nginx_digest }}
          LIVEKIT_DIGEST: ${{ needs.build-and-push.outputs.livekit_digest }}
          SPEECH_SERVICE_DIGEST: ${{ needs.build-and-push.outputs.speech_service_digest }}
          VOICE_AGENT_DIGEST: ${{ needs.build-and-push.outputs.voice_agent_digest }}
        run: |
          set -euo pipefail
          for digest in "$BACKEND_DIGEST" "$FRONTEND_DIGEST" "$NGINX_DIGEST" "$LIVEKIT_DIGEST" "$SPEECH_SERVICE_DIGEST" "$VOICE_AGENT_DIGEST"; do
            case "$digest" in sha256:*) ;; *) echo "Invalid image digest: $digest" >&2; exit 1 ;; esac
          done
          {
            echo "RELEASE_SHA=$RELEASE_SHA"
            echo "BACKEND_IMAGE=$DH_USER/resume-backend@$BACKEND_DIGEST"
            echo "FRONTEND_IMAGE=$DH_USER/resume-frontend@$FRONTEND_DIGEST"
            echo "NGINX_IMAGE=$DH_USER/resume-nginx@$NGINX_DIGEST"
            echo "LIVEKIT_IMAGE=$DH_USER/resume-livekit@$LIVEKIT_DIGEST"
            echo "SPEECH_SERVICE_IMAGE=$DH_USER/resume-speech-service@$SPEECH_SERVICE_DIGEST"
            echo "VOICE_AGENT_IMAGE=$DH_USER/resume-voice-agent@$VOICE_AGENT_DIGEST"
          } > release-manifest.env

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-${{ needs.resolve-tag.outputs.release_sha }}
          path: release-manifest.env
          retention-days: 90

      - name: Deployment summary
        run: |
          echo "=== Deployment Complete ==="
          echo "Environment: ${{ needs.resolve-tag.outputs.environment }}"
          echo "Image tag:   ${{ needs.resolve-tag.outputs.image_tag }}"
          echo ""
          echo "Staging: CD reconciled the web containers with the published staging images."
          echo "Production: Watchtower is MONITOR-ONLY by default (approval gate)."
          echo "  Download the release-manifest-${{ needs.resolve-tag.outputs.release_sha }} artifact after approval."
          echo "    docker compose --env-file release-manifest.env -f docker-compose.prod.yml pull"
          echo "    docker compose --env-file release-manifest.env -f docker-compose.prod.yml up -d"
          echo "  Rollback: deploy the previous known-good release-manifest.env artifact."
          echo "Never deploy application :latest. Do not rebuild production after approval."
          echo "All ARIA application images are pinned by digest in the release manifest."
