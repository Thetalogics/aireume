name: Deploy staging images

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit SHA baked into the staging images
        required: true
        type: string
      ssh_username:
        description: Optional recovery override for the configured VPS username
        required: false
        type: string
  workflow_call:
    inputs:
      target_environment:
        description: Resolved CD target environment
        required: true
        type: string
      expected_sha:
        description: Commit SHA baked into the staging images
        required: true
        type: string
      ssh_username:
        description: Optional recovery override for the configured VPS username
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging-e2e
    steps:
      - name: Preserve production promotion boundary
        if: ${{ inputs.target_environment == 'production' }}
        run: echo "Production promotion does not mutate staging."

      - name: Select staging deployment transport
        id: transport
        if: ${{ inputs.target_environment != 'production' }}
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ inputs.ssh_username || secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_KEY_FINGERPRINT: ${{ vars.VPS_SSH_KEY_FINGERPRINT }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$PORTAINER_WEBHOOK_URL" ]; then
            echo "transport=portainer" >> "$GITHUB_OUTPUT"
            echo "Using the configured Portainer stack webhook."
            exit 0
          fi

          for name in VPS_HOST VPS_USERNAME VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS VPS_SSH_KEY_FINGERPRINT DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "No Portainer webhook is configured and SSH deployment secret $name is missing." >&2
              exit 1
            fi
          done
          echo "transport=ssh" >> "$GITHUB_OUTPUT"
          echo "Using audited SSH deployment."

      - name: Trigger Portainer staging stack webhook
        if: ${{ inputs.target_environment != 'production' && steps.transport.outputs.transport == 'portainer' }}
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-ARIA-Release-SHA: $EXPECTED_SHA" \
            "$PORTAINER_WEBHOOK_URL"
          echo "Portainer accepted the staging reconciliation request for $EXPECTED_SHA."

      - name: Configure SSH
        if: ${{ inputs.target_environment != 'production' && steps.transport.outputs.transport == 'ssh' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_KEY_FINGERPRINT: ${{ vars.VPS_SSH_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          key_path="$HOME/.ssh/aria_deploy"
          if [[ "$VPS_SSH_KEY" == *'\n'* ]]; then
            printf '%b\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key_path"
          else
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key_path"
          fi
          chmod 600 "$key_path"
          if ! ssh-keygen -y -f "$key_path" >/dev/null 2>&1; then
            printf '%s' "$VPS_SSH_KEY" | base64 --decode > "$key_path.decoded"
            mv "$key_path.decoded" "$key_path"
            chmod 600 "$key_path"
          fi
          ssh-keygen -y -f "$key_path" > "$key_path.pub"
          actual_fingerprint="$(ssh-keygen -lf "$key_path.pub" -E sha256 | awk '{print $2}')"
          if [ "$actual_fingerprint" != "$VPS_SSH_KEY_FINGERPRINT" ]; then
            echo "VPS_SSH_KEY fingerprint does not match VPS_SSH_KEY_FINGERPRINT." >&2
            exit 1
          fi
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Authenticate and reconcile staging containers
        if: ${{ inputs.target_environment != 'production' && steps.transport.outputs.transport == 'ssh' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ inputs.ssh_username || secrets.VPS_USERNAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$DOCKERHUB_USERNAME"
            printf '%s\n' "$DOCKERHUB_TOKEN"
            printf '%s\n' "$EXPECTED_SHA"
          } | ssh \
            -i "$HOME/.ssh/aria_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USERNAME@$VPS_HOST" deploy-staging

      - name: Wait for healthy staging deployment at the expected SHA
        if: ${{ inputs.target_environment != 'production' }}
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          BASE_URL="${E2E_BASE_URL%/}"
          for attempt in $(seq 1 48); do
            READY="$(curl --fail --silent --show-error "$BASE_URL/ready" 2>/dev/null || true)"
            VERSION="$(curl --fail --silent --show-error "$BASE_URL/api/version" 2>/dev/null || true)"
            READY_STATUS="$(printf '%s' "$READY" | jq -r '.status // empty' 2>/dev/null || true)"
            ACTUAL_SHA="$(printf '%s' "$VERSION" | jq -r '.build_id // empty' 2>/dev/null || true)"
            if [ "$READY_STATUS" = "ready" ] && { [ -z "$EXPECTED_SHA" ] || [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; }; then
              echo "Staging is ready at build ${ACTUAL_SHA:-unversioned}."
              exit 0
            fi
            echo "Waiting for staging build ${EXPECTED_SHA:-any}; currently ${ACTUAL_SHA:-unavailable} (attempt $attempt/48)."
            sleep 15
          done
          echo "Staging did not become ready at expected build '$EXPECTED_SHA'." >&2
          exit 1

      - name: Remove SSH material
        if: ${{ always() && inputs.target_environment != 'production' && steps.transport.outputs.transport == 'ssh' }}
        run: rm -f "$HOME/.ssh/aria_deploy" "$HOME/.ssh/aria_deploy.pub" "$HOME/.ssh/known_hosts"
