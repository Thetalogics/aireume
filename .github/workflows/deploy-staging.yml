name: Deploy staging images

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Commit SHA baked into the staging images
        required: true
        type: string
      ssh_username:
        description: Optional recovery override for the configured VPS username
        required: false
        type: string
  workflow_call:
    inputs:
      target_environment:
        description: Resolved CD target environment
        required: true
        type: string
      expected_sha:
        description: Commit SHA baked into the staging images
        required: true
        type: string
      ssh_username:
        description: Optional recovery override for the configured VPS username
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging-e2e
    steps:
      - name: Preserve production promotion boundary
        if: ${{ inputs.target_environment == 'production' }}
        run: echo "Production promotion does not mutate staging."

      - name: Select staging deployment transport
        id: transport
        if: ${{ inputs.target_environment != 'production' }}
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ inputs.ssh_username || secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$PORTAINER_WEBHOOK_URL" ]; then
            echo "transport=portainer" >> "$GITHUB_OUTPUT"
            echo "Using the configured Portainer stack webhook."
            exit 0
          fi

          for name in VPS_HOST VPS_USERNAME VPS_SSH_KEY DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "No Portainer webhook is configured and SSH deployment secret $name is missing." >&2
              exit 1
            fi
          done
          echo "transport=ssh" >> "$GITHUB_OUTPUT"
          echo "Using audited SSH deployment."

      - name: Trigger Portainer staging stack webhook
        if: ${{ inputs.target_environment != 'production' && steps.transport.outputs.transport == 'portainer' }}
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-ARIA-Release-SHA: $EXPECTED_SHA" \
            "$PORTAINER_WEBHOOK_URL"
          echo "Portainer accepted the staging reconciliation request for $EXPECTED_SHA."

      - name: Configure SSH
        if: ${{ inputs.target_environment != 'production' && steps.transport.outputs.transport == 'ssh' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          key_path="$HOME/.ssh/aria_deploy"
          if [[ "$VPS_SSH_KEY" == *'\n'* ]]; then
            printf '%b\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key_path"
          else
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key_path"
          fi
          chmod 600 "$key_path"
          if ! ssh-keygen -y -f "$key_path" >/dev/null 2>&1; then
            printf '%s' "$VPS_SSH_KEY" | base64 --decode > "$key_path.decoded"
            mv "$key_path.decoded" "$key_path"
            chmod 600 "$key_path"
          fi
          ssh-keygen -y -f "$key_path" >/dev/null
          ssh-keyscan -T 15 -H "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Authenticate staging host to Docker Hub
        if: ${{ inputs.target_environment != 'production' && steps.transport.outputs.transport == 'ssh' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ inputs.ssh_username || secrets.VPS_USERNAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$DOCKERHUB_USERNAME"
            printf '%s\n' "$DOCKERHUB_TOKEN"
          } | ssh -i "$HOME/.ssh/aria_deploy" "$VPS_USERNAME@$VPS_HOST" '
            set -e
            IFS= read -r registry_user
            IFS= read -r registry_token
            printf "%s" "$registry_token" | docker login --username "$registry_user" --password-stdin
          '

      - name: Reconcile staging containers with published images
        if: ${{ inputs.target_environment != 'production' && steps.transport.outputs.transport == 'ssh' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ inputs.ssh_username || secrets.VPS_USERNAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/aria_deploy" "$VPS_USERNAME@$VPS_HOST" bash -s -- "$DOCKERHUB_USERNAME" "$EXPECTED_SHA" <<'REMOTE'
          set -euo pipefail
          registry_user="$1"
          expected_sha="$2"
          services="staging-backend staging-frontend staging-nginx"

          for container in $services staging-watchtower; do
            docker inspect "$container" >/dev/null
          done

          for image in \
            "$registry_user/resume-backend:staging" \
            "$registry_user/resume-frontend:staging" \
            "$registry_user/resume-nginx:staging"; do
            docker pull "$image"
          done

          watchtower_image="$(docker inspect staging-watchtower --format '{{.Image}}')"
          docker_config="$HOME/.docker/config.json"
          test -s "$docker_config"

          restore_monitor() {
            docker start staging-watchtower >/dev/null 2>&1 || true
            docker logout >/dev/null 2>&1 || true
          }
          trap restore_monitor EXIT

          docker stop staging-watchtower >/dev/null
          docker rm -f aria-staging-release >/dev/null 2>&1 || true
          docker run --rm \
            --name aria-staging-release \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$docker_config:/config.json:ro" \
            "$watchtower_image" \
            --run-once --cleanup --rolling-restart \
            $services

          restore_monitor
          trap - EXIT
          echo "Staging containers reconciled for candidate $expected_sha."
          REMOTE

      - name: Remove SSH material
        if: ${{ always() && inputs.target_environment != 'production' && steps.transport.outputs.transport == 'ssh' }}
        run: rm -f "$HOME/.ssh/aria_deploy" "$HOME/.ssh/known_hosts"
