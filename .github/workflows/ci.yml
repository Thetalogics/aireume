name: CI - Test on Pull Request

# Event semantics (intentional):
# - push / pull_request: full functional CI (tests, scans, compose, CodeQL-adjacent jobs)
# - schedule (Monday 06:00 UTC): secret-scan-history only (full-history gitleaks)
# - workflow_dispatch: functional jobs plus secret-scan-history
# A scheduled full-history secret finding is a security-baseline event, not a product
# functional regression.

on:
  pull_request:
    branches: [ main, staging, production ]
  push:
    branches: [ main, staging, production ]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test-backend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install xmlsec (python3-saml)
      run: |
        sudo apt-get update
        sudo apt-get install -y xmlsec1 libxmlsec1-dev libxml2-dev pkg-config

    - name: Install dependencies
      run: |
        python -m pip install pip==25.3
        pip install --require-hashes -r app/backend/requirements.lock
        python -c "import importlib.util; print('langgraph:', importlib.util.find_spec('langgraph'))"

    - name: Run backend tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # Coverage gate: 50% of services/routes/middleware is the current
        # regression baseline (ratchet toward 70% as suites grow). Do not lower.
        pytest app/backend/tests/ -v --cov=app.backend.services --cov=app.backend.routes --cov=app.backend.middleware --cov-report=xml --cov-fail-under=50

    - name: Upload coverage
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  reliability-postgres:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: aria
          POSTGRES_DB: aria_rel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aria:aria@localhost:5432/aria_rel
      RELIABILITY_POSTGRES_URL: postgresql+psycopg2://aria:aria@localhost:5432/aria_rel
      PHASE0_POSTGRES_URL: postgresql+psycopg2://aria:aria@localhost:5432/aria_rel
      RELIABILITY_REQUIRED: "1"
      GOVERNANCE_POSTGRES_REQUIRED: "1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'
    - name: Install xmlsec (python3-saml)
      run: |
        sudo apt-get update
        sudo apt-get install -y xmlsec1 libxmlsec1-dev libxml2-dev pkg-config
    - name: Install dependencies
      run: |
        python -m pip install pip==25.3
        pip install --require-hashes -r app/backend/requirements.lock
    - name: Migrate
      run: alembic -c alembic.ini upgrade head
    - name: Reliability PostgreSQL tests (fail if skipped)
      run: |
        set -euo pipefail
        python -m pytest \
          app/backend/tests/test_reliability_postgres.py \
          app/backend/tests/test_phase0_postgres.py \
          app/backend/tests/test_governance_postgres.py \
          app/backend/tests/test_phase0_076_to_head.py \
          app/backend/tests/test_request_idempotency.py \
          app/backend/tests/test_voice_schedule_idempotency.py \
          app/backend/tests/test_migration_owner_lock.py \
          app/backend/tests/test_backup_restore.py \
          app/backend/tests/test_deployment_config.py \
          app/backend/tests/test_worker_health.py \
          app/backend/tests/test_alembic_drift.py \
          -v --timeout=120 --tb=short
        python -c "import os; assert os.environ.get('RELIABILITY_POSTGRES_URL')"

  reliability-redis:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
      RELIABILITY_REDIS_REQUIRED: "1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'
    - name: Install xmlsec (python3-saml)
      run: |
        sudo apt-get update
        sudo apt-get install -y xmlsec1 libxmlsec1-dev libxml2-dev pkg-config
    - name: Install dependencies
      run: |
        python -m pip install pip==25.3
        pip install --require-hashes -r app/backend/requirements.lock
    - name: Redis reliability tests
      run: |
        python -c "import os; assert os.environ.get('REDIS_URL') and os.environ.get('RELIABILITY_REDIS_REQUIRED') == '1'"
        python -m pytest \
          app/backend/tests/test_reliability_redis.py \
          app/backend/tests/test_llm_concurrency_redis.py \
          app/backend/tests/test_auth_rate_limit_redis.py \
          app/backend/tests/test_rate_limit_headers_redis.py \
          -v --timeout=30

  gdpr-object-storage:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      OBJECT_STORAGE_INTEGRATION_REQUIRED: "1"
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: aria-gdpr-ci
      S3_REGION: us-east-1
      S3_USE_PATH_STYLE: "true"
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'
    - name: Install xmlsec (python3-saml)
      run: |
        sudo apt-get update
        sudo apt-get install -y xmlsec1 libxmlsec1-dev libxml2-dev pkg-config
    - name: Install dependencies
      run: |
        python -m pip install pip==25.3
        pip install --require-hashes -r app/backend/requirements.lock
    - name: Start pinned MinIO and create test bucket
      run: |
        set -euo pipefail
        docker run -d --rm --name aria-minio \
          -p 9000:9000 \
          -e MINIO_ROOT_USER="$S3_ACCESS_KEY" \
          -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
          docker.io/bitnamilegacy/minio@sha256:953d489a81cc4de7975f90e07202189c4325da39b0b92470b6a13c7ea99e36cd
        for attempt in $(seq 1 30); do
          if curl --fail --silent "$S3_ENDPOINT/minio/health/ready"; then
            break
          fi
          if [ "$attempt" = "30" ]; then
            docker logs aria-minio
            exit 1
          fi
          sleep 1
        done
        python -c "import boto3, os; boto3.client('s3', endpoint_url=os.environ['S3_ENDPOINT'], aws_access_key_id=os.environ['S3_ACCESS_KEY'], aws_secret_access_key=os.environ['S3_SECRET_KEY'], region_name=os.environ['S3_REGION']).create_bucket(Bucket=os.environ['S3_BUCKET'])"
    - name: Run real object-storage GDPR tests
      run: |
        python -m pytest app/backend/tests/test_gdpr_object_storage_integration.py \
          -v --timeout=60 --tb=short
    - name: Show MinIO logs on failure
      if: failure()
      run: docker logs aria-minio

  test-frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: app/frontend/package-lock.json

    - name: Install dependencies
      working-directory: app/frontend
      run: npm ci

    - name: Run frontend tests
      working-directory: app/frontend
      run: npm test

    - name: Lint frontend
      working-directory: app/frontend
      run: npm run lint

    - name: Build frontend
      working-directory: app/frontend
      run: npm run build

    - name: Audit frontend dependencies
      working-directory: app/frontend
      run: npm audit --audit-level=high

  # Browser E2E for deterministic frontend paths. Secret-free: builds the
  # frontend, serves it with `vite preview`, and runs login plus mocked
  # authenticated dashboard specs in real Chromium. Full upload/analyze E2E
  # needs backend services and is run locally/against staging.
  test-e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'

    - name: Install E2E runner (root)
      run: npm ci

    - name: Install frontend dependencies
      working-directory: app/frontend
      run: npm ci

    - name: Build frontend
      working-directory: app/frontend
      run: npm run build

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium

    - name: Run deterministic browser E2E
      run: npx playwright test --config=playwright.ci.config.ts

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

  # Real browser -> API -> PostgreSQL/Redis integration. This job creates a
  # disposable tenant in isolated service containers and must not use mocks,
  # provider credentials, or a shared staging account.
  integration-e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: aria
          POSTGRES_DB: aria_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://aria:aria@127.0.0.1:5432/aria_e2e
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_REQUIRED: "1"
      JWT_SECRET_KEY: ci-integration-jwt-secret-at-least-32-bytes
      INTERNAL_SERVICE_SECRET: ci-integration-service-secret-at-least-32-bytes
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      E2E_TEST_MODE: "1"
      RUN_BACKGROUND_WORKERS: "0"
      OLLAMA_BASE_URL: https://ollama.com
      OLLAMA_MODEL: ci-not-invoked
      OLLAMA_API_KEY: ci-not-invoked
      OLLAMA_HEALTH_SENTINEL_ENABLED: "0"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      PLAYWRIGHT_API_URL: http://127.0.0.1:8000
      BUILD_ID: ${{ github.sha }}
      GIT_SHA: ${{ github.sha }}
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          app/frontend/package-lock.json

    - name: Install backend system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xmlsec1 libxmlsec1-dev libxml2-dev pkg-config

    - name: Install locked dependencies
      run: |
        python -m pip install pip==25.3
        pip install --require-hashes -r app/backend/requirements.lock
        npm ci
        npm ci --prefix app/frontend

    - name: Migrate isolated E2E database
      run: alembic -c alembic.ini upgrade head

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium

    - name: Run real-backend browser integration
      run: npx playwright test --config=playwright.integration.config.ts

    - name: Upload real-backend Playwright report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: playwright-real-backend-report
        path: playwright-report/
        retention-days: 14

  # Validate the Alembic migration chain against a real PostgreSQL instance.
  # Catches multiple-heads, broken revisions, and non-idempotent migrations
  # before they reach a deploy (migrations run automatically via the container
  # entrypoint, so a broken chain would otherwise fail on production startup).
  migration-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: aria
          POSTGRES_DB: aria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aria:aria@localhost:5432/aria_test
      RELIABILITY_POSTGRES_URL: postgresql+psycopg2://aria:aria@localhost:5432/aria_test
      RELIABILITY_REQUIRED: "1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install pip==25.3
        pip install --require-hashes -r app/backend/requirements.lock

    - name: Assert a single Alembic head
      run: |
        HEADS=$(python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; s=ScriptDirectory.from_config(Config('alembic.ini')); print(len(s.get_heads()))")
        echo "Alembic heads: $HEADS"
        test "$HEADS" = "1"

    - name: Run migrations up, then down, then up again
      run: |
        alembic -c alembic.ini upgrade head
        alembic -c alembic.ini downgrade -1
        alembic -c alembic.ini upgrade head
        python -m pytest \
          app/backend/tests/test_alembic_drift.py \
          -v \
          --tb=short \
          --strict-markers \
          --timeout=180 \
          --junitxml=/tmp/alembic-drift.xml
        python -c "
        from xml.etree import ElementTree as ET
        root = ET.parse('/tmp/alembic-drift.xml').getroot()
        suite = root if root.tag.endswith('testsuite') else root.find('.//{*}testsuite')
        skipped = int(suite.attrib.get('skipped', 0) or 0)
        failed = int(suite.attrib.get('failures', 0) or 0)
        errors = int(suite.attrib.get('errors', 0) or 0)
        assert skipped == 0 and failed == 0 and errors == 0, suite.attrib
        "

  secret-scan:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0

    - name: Secret scan (gitleaks, commit range)
      run: |
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
        tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
        else
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.sha }}^..${{ github.sha }}"
          else
            RANGE="$BEFORE..${{ github.sha }}"
          fi
        fi
        echo "Scanning $RANGE"
        /tmp/gitleaks detect --source . --log-opts="$RANGE" --verbose --redact --exit-code 1 --config .gitleaks.toml

  secret-scan-history:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0

    - name: Secret scan (gitleaks, full history)
      run: |
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
        tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
        /tmp/gitleaks detect --source . --verbose --redact --exit-code 1 --config .gitleaks.toml

  dependency-scan:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Python dependency vulnerability audit (pip-audit)
      run: |
        python -m pip install pip==25.3 pip-audit==2.9.0
        python scripts/check_pip_audit_exceptions.py
        # Exceptions are reviewed in security/pip-audit-exceptions.json.
        pip-audit -r app/backend/requirements.lock \
          --ignore-vuln PYSEC-2026-1325 \
          --ignore-vuln PYSEC-2026-1845 \
          --ignore-vuln PYSEC-2026-2263 \
          --ignore-vuln PYSEC-2026-2447 \
          --ignore-vuln PYSEC-2026-3455 \
          --ignore-vuln PYSEC-2026-3456 \
          --ignore-vuln PYSEC-2026-3457

  compose-validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Validate compose files
      run: |
        set -euo pipefail
        export RELEASE_SHA=deadbeef
        export BACKEND_IMAGE=example.invalid/resume-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        export FRONTEND_IMAGE=example.invalid/resume-frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        export NGINX_IMAGE=example.invalid/resume-nginx@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        export LIVEKIT_IMAGE=example.invalid/resume-livekit@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
        export SPEECH_SERVICE_IMAGE=example.invalid/resume-speech-service@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
        export VOICE_AGENT_IMAGE=example.invalid/resume-voice-agent@sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
        export POSTGRES_PASSWORD=x
        export REDIS_PASSWORD=x
        export JWT_SECRET_KEY=x
        export INTERNAL_SERVICE_SECRET=x
        export OLLAMA_API_KEY=x
        export S3_ENDPOINT=https://example.invalid
        export LIVEKIT_API_KEY=x
        export LIVEKIT_API_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        docker compose -f docker-compose.prod.yml config >/tmp/prod.yml
        test "$(grep -c 'example.invalid/resume-.*@sha256:' /tmp/prod.yml)" -ge 8
        grep -q 'REDIS_REQUIRED=1' docker-compose.prod.yml
        grep -q 'migrate:' docker-compose.prod.yml
        test "$(grep -c 'service_completed_successfully' docker-compose.prod.yml)" -ge 2
        grep -q 'profiles: \["local-ollama"\]' docker-compose.prod.yml
        export STAGING_POSTGRES_PASSWORD=x
        export STAGING_JWT_SECRET_KEY=x
        export STAGING_LIVEKIT_NODE_IP=203.0.113.10
        export STAGING_LIVEKIT_API_KEY=x
        export STAGING_LIVEKIT_API_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        docker compose -f docker-compose.staging.yml config >/tmp/staging.yml
        export GEMINI_API_KEY=x
        export LIVEKIT_URL=wss://example.invalid
        export SIP_AUTH_PASSWORD=x
        docker compose -f docker-compose.main.staging.yml config >/tmp/main-staging.yml
        export ARIA_BACKEND_URL=https://example.invalid
        docker compose -f docker-compose.voice.staging.yml config >/tmp/voice-staging.yml

  filesystem-scan:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Filesystem vulnerability scan (Trivy)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,misconfig
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'
        skip-dirs: node_modules,.venv,venv,.git
        trivyignores: .trivyignore.yaml
