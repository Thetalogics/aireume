name: CI - Test on Pull Request

on:
  pull_request:
    branches: [ main, staging, production ]
  push:
    branches: [ main, staging, production ]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test-backend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install xmlsec (python3-saml)
      run: |
        sudo apt-get update
        sudo apt-get install -y xmlsec1 libxmlsec1-dev libxml2-dev pkg-config

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/backend/requirements.txt
        pip install pytest pytest-asyncio pytest-cov respx pytest-timeout
        python -c "import importlib.util; print('langgraph:', importlib.util.find_spec('langgraph'))"

    - name: Run backend tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # Coverage gate: 50% of services/routes/middleware is the current
        # regression baseline (ratchet toward 70% as suites grow). Do not lower.
        pytest app/backend/tests/ -v --cov=app.backend.services --cov=app.backend.routes --cov=app.backend.middleware --cov-report=xml --cov-fail-under=50

    - name: Upload coverage
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  reliability-postgres:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: aria
          POSTGRES_DB: aria_rel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aria:aria@localhost:5432/aria_rel
      RELIABILITY_POSTGRES_URL: postgresql+psycopg://aria:aria@localhost:5432/aria_rel
      PHASE0_POSTGRES_URL: postgresql+psycopg://aria:aria@localhost:5432/aria_rel
      RELIABILITY_REQUIRED: "1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'
    - name: Install xmlsec (python3-saml)
      run: |
        sudo apt-get update
        sudo apt-get install -y xmlsec1 libxmlsec1-dev libxml2-dev pkg-config
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/backend/requirements.txt
        pip install pytest pytest-asyncio pytest-cov respx pytest-timeout
    - name: Migrate
      run: alembic -c alembic.ini upgrade heads
    - name: Reliability PostgreSQL tests (fail if skipped)
      run: |
        set -euo pipefail
        python -m pytest app/backend/tests/test_reliability_postgres.py app/backend/tests/test_phase0_postgres.py -v --timeout=60 --tb=short
        python -c "import os; assert os.environ.get('RELIABILITY_POSTGRES_URL')"

  reliability-redis:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
      RELIABILITY_REDIS_REQUIRED: "1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'
    - name: Install xmlsec (python3-saml)
      run: |
        sudo apt-get update
        sudo apt-get install -y xmlsec1 libxmlsec1-dev libxml2-dev pkg-config
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/backend/requirements.txt
        pip install pytest pytest-asyncio pytest-timeout redis
    - name: Redis reliability tests
      run: |
        python -c "import os; assert os.environ.get('REDIS_URL') and os.environ.get('RELIABILITY_REDIS_REQUIRED') == '1'"
        python -m pytest app/backend/tests/test_reliability_redis.py -v --timeout=30

  test-frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: app/frontend/package-lock.json

    - name: Install dependencies
      working-directory: app/frontend
      run: npm ci

    - name: Run frontend tests
      working-directory: app/frontend
      run: npm test

    - name: Lint frontend
      working-directory: app/frontend
      run: npm run lint

    - name: Build frontend
      working-directory: app/frontend
      run: npm run build

    - name: Audit frontend dependencies
      working-directory: app/frontend
      run: npm audit --audit-level=high

  # Browser E2E for the unauthenticated login page. Deterministic and
  # secret-free: builds the frontend, serves it with `vite preview`, and runs
  # only the "Auth workflow (login page)" specs in real Chromium. Authenticated
  # E2E needs the full stack and is run manually/against staging, not here.
  test-e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'

    - name: Install E2E runner (root)
      run: npm ci

    - name: Install frontend dependencies
      working-directory: app/frontend
      run: npm ci

    - name: Build frontend
      working-directory: app/frontend
      run: npm run build

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium

    - name: Run login-page E2E
      run: npx playwright test --config=playwright.ci.config.ts

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

  # Validate the Alembic migration chain against a real PostgreSQL instance.
  # Catches multiple-heads, broken revisions, and non-idempotent migrations
  # before they reach a deploy (migrations run automatically via the container
  # entrypoint, so a broken chain would otherwise fail on production startup).
  migration-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aria
          POSTGRES_PASSWORD: aria
          POSTGRES_DB: aria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://aria:aria@localhost:5432/aria_test
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/backend/requirements.txt

    - name: Assert a single Alembic head
      run: |
        HEADS=$(python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; s=ScriptDirectory.from_config(Config('alembic.ini')); print(len(s.get_heads()))")
        echo "Alembic heads: $HEADS"
        test "$HEADS" = "1"

    - name: Run migrations up, then down, then up again
      run: |
        alembic -c alembic.ini upgrade heads
        alembic -c alembic.ini downgrade -1
        alembic -c alembic.ini upgrade heads

  secret-scan:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0

    - name: Secret scan (gitleaks, commit range)
      run: |
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
        tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
        else
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.sha }}^..${{ github.sha }}"
          else
            RANGE="$BEFORE..${{ github.sha }}"
          fi
        fi
        echo "Scanning $RANGE"
        /tmp/gitleaks detect --source . --log-opts="$RANGE" --verbose --redact --exit-code 1 --config .gitleaks.toml

  secret-scan-history:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0

    - name: Secret scan (gitleaks, full history)
      run: |
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
        tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
        /tmp/gitleaks detect --source . --verbose --redact --exit-code 1 --config .gitleaks.toml

  dependency-scan:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Python dependency vulnerability audit (pip-audit)
      run: |
        python -m pip install --upgrade pip pip-audit
        # Unfixed transitives of python-jose 3.4.0: ecdsa (no patched release)
        # and pyasn1 (jose requires pyasn1<0.5.0; DoS fixes are in 0.6.4).
        # pytest 8.3.4 is kept for pytest-asyncio 0.24; PYSEC-2026-1845 is 9.0.3.
        # diskcache 5.6.3 (outlines transitive): PYSEC-2026-2447 — local pickle RCE
        # requires write access to cache dir; no PyPI fix release yet.
        pip-audit -r app/backend/requirements.txt \
          --ignore-vuln PYSEC-2026-1325 \
          --ignore-vuln PYSEC-2026-1845 \
          --ignore-vuln PYSEC-2026-2263 \
          --ignore-vuln PYSEC-2026-2447 \
          --ignore-vuln PYSEC-2026-3455 \
          --ignore-vuln PYSEC-2026-3456 \
          --ignore-vuln PYSEC-2026-3457

  filesystem-scan:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Filesystem vulnerability scan (Trivy)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: '1'
