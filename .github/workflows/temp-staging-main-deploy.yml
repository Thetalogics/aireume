name: Temp - Deploy main staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: temp-staging-main-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-main:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: staging
      RELEASE_SHA: ${{ github.sha }}
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./app/backend/Dockerfile
          push: true
          tags: |
            ${{ env.DH_USER }}/resume-backend:${{ env.RELEASE_SHA }}
            ${{ env.DH_USER }}/resume-backend:${{ env.IMAGE_TAG }}
          build-args: |
            BUILD_ID=${{ env.RELEASE_SHA }}
            GIT_SHA=${{ env.RELEASE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./app/frontend
          push: true
          tags: |
            ${{ env.DH_USER }}/resume-frontend:${{ env.RELEASE_SHA }}
            ${{ env.DH_USER }}/resume-frontend:${{ env.IMAGE_TAG }}
          build-args: |
            BUILD_ID=${{ env.RELEASE_SHA }}
            GIT_SHA=${{ env.RELEASE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push nginx
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ env.DH_USER }}/resume-nginx:${{ env.RELEASE_SHA }}
            ${{ env.DH_USER }}/resume-nginx:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy-staging:
    needs: [build-and-push-main]
    uses: ./.github/workflows/deploy-staging.yml
    with:
      target_environment: staging
      expected_sha: ${{ github.sha }}
    secrets: inherit
