name: Staging UAT user

on:
  workflow_dispatch:

jobs:
  create-uat-user:
    runs-on: ubuntu-latest
    environment: staging-e2e
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_KEY_FINGERPRINT: ${{ vars.VPS_SSH_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          key_path="$HOME/.ssh/aria_deploy"
          if [[ "$VPS_SSH_KEY" == *'\n'* ]]; then
            printf '%b\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key_path"
          else
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$key_path"
          fi
          chmod 600 "$key_path"
          if ! ssh-keygen -y -f "$key_path" >/dev/null 2>&1; then
            printf '%s' "$VPS_SSH_KEY" | base64 --decode > "$key_path.decoded"
            mv "$key_path.decoded" "$key_path"
            chmod 600 "$key_path"
          fi
          ssh-keygen -y -f "$key_path" > "$key_path.pub"
          actual_fingerprint="$(ssh-keygen -lf "$key_path.pub" -E sha256 | awk '{print $2}')"
          if [ "$actual_fingerprint" != "$VPS_SSH_KEY_FINGERPRINT" ]; then
            echo "VPS_SSH_KEY fingerprint does not match VPS_SSH_KEY_FINGERPRINT." >&2
            exit 1
          fi
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Create or reset staging UAT recruiter account
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          SCRIPT_B64: ${{ secrets.UAT_CREATE_SCRIPT_B64 }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SCRIPT_B64" | ssh \
            -i "$HOME/.ssh/aria_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USERNAME@$VPS_HOST" \
            'read SCRIPT_B64; printf "%s" "$SCRIPT_B64" | base64 -d | docker exec -i staging-backend python -'

      - name: Remove SSH material
        if: always()
        run: rm -f "$HOME/.ssh/aria_deploy" "$HOME/.ssh/aria_deploy.pub" "$HOME/.ssh/known_hosts"
