name: Authenticated staging E2E

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional deployed commit SHA to require
        required: false
        type: string
  workflow_call:
    inputs:
      expected_sha:
        description: Deployed commit SHA that staging must report
        required: false
        type: string

# Deployment-environment gate. CD requires this workflow before emitting an
# approved immutable release manifest; it can also be dispatched manually.
# Requires GitHub environment `staging-e2e` variable `E2E_BASE_URL` and
# repository/environment secrets `E2E_EMAIL`, `E2E_PASSWORD`, `E2E_WORKSPACE`.
# MFA must be disabled only on this dedicated non-privileged test account.
# Application MFA policy is not changed by this workflow.

jobs:
  authenticated-e2e:
    runs-on: ubuntu-latest
    environment: staging-e2e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Require dedicated test-account secrets
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_WORKSPACE: ${{ secrets.E2E_WORKSPACE }}
        run: |
          set -euo pipefail
          if [ -z "${E2E_BASE_URL}" ] || [ -z "${E2E_EMAIL}" ] || [ -z "${E2E_PASSWORD}" ] || [ -z "${E2E_WORKSPACE}" ]; then
            echo "Missing staging E2E configuration. Set environment variable E2E_BASE_URL and secrets E2E_WORKSPACE, E2E_EMAIL, E2E_PASSWORD."
            echo "Use a dedicated non-privileged recruiter with MFA disabled only on that account."
            exit 1
          fi
      - name: Wait for healthy staging deployment at the expected SHA
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          BASE_URL="${E2E_BASE_URL%/}"
          for attempt in $(seq 1 36); do
            READY="$(curl --fail --silent --show-error "$BASE_URL/ready" 2>/dev/null || true)"
            VERSION="$(curl --fail --silent --show-error "$BASE_URL/api/version" 2>/dev/null || true)"
            ACTUAL_SHA="$(printf '%s' "$VERSION" | jq -r '.build_id // empty' 2>/dev/null || true)"
            if [ -n "$READY" ] && { [ -z "$EXPECTED_SHA" ] || [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; }; then
              echo "Staging is ready at build ${ACTUAL_SHA:-unversioned}."
              exit 0
            fi
            echo "Waiting for staging build ${EXPECTED_SHA:-any}; currently ${ACTUAL_SHA:-unavailable} (attempt $attempt/36)."
            sleep 10
          done
          echo "Staging did not become ready at expected build '$EXPECTED_SHA'." >&2
          exit 1
      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run authenticated staging specs
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          PLAYWRIGHT_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_WORKSPACE: ${{ secrets.E2E_WORKSPACE }}
          E2E_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: npx playwright test --config=playwright.staging.config.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-staging-e2e
          path: playwright-report/
          retention-days: 7
