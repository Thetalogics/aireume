name: E2E - Staging (authenticated)

# Critical authenticated flow against live staging. Does not treat a missing
# secret configuration as a successful product test — the job records
# "not configured" and skips Playwright.
#
# Dedicated tenant: E2E_WORKSPACE must be a stable recruiter/admin workspace with
# screening quota, completed onboarding, and password login (not SSO-enforced).
# If that account has MFA enabled, set E2E_MFA_SECRET (TOTP base32). Do not disable MFA in app code.
# Staging is same-origin (SPA + /api). Set E2E_API_URL only if the API is a separate origin.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override staging base URL (optional)'
        required: false
        default: ''
  workflow_run:
    workflows: [CD - Build & Push Images]
    types: [completed]
    branches: [main, production]

concurrency:
  group: e2e-staging
  cancel-in-progress: true

jobs:
  e2e-staging:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_WORKSPACE: ${{ secrets.E2E_WORKSPACE }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_MFA_SECRET: ${{ secrets.E2E_MFA_SECRET }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_API_URL: ${{ secrets.E2E_API_URL }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'

    - name: Guard — staging secrets
      id: guard
      run: |
        if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ] || [ -z "$E2E_WORKSPACE" ]; then
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=AUD-048::Authenticated staging E2E not configured. Set E2E_WORKSPACE, E2E_EMAIL, E2E_PASSWORD (and optional E2E_BASE_URL / E2E_API_URL). This run is skipped, not a product pass."
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install E2E runner (root)
      if: steps.guard.outputs.configured == 'true'
      run: npm ci

    - name: Install Playwright browser
      if: steps.guard.outputs.configured == 'true'
      run: npx playwright install --with-deps chromium

    - name: Run authenticated staging E2E
      if: steps.guard.outputs.configured == 'true'
      run: npx playwright test e2e/auth.setup.ts e2e/staging-critical-flow.spec.ts
      env:
        PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url || secrets.E2E_BASE_URL || 'https://airesume-staging.thetalogics.com' }}
        PLAYWRIGHT_API_URL: ${{ secrets.E2E_API_URL || github.event.inputs.base_url || secrets.E2E_BASE_URL || 'https://airesume-staging.thetalogics.com' }}

    - name: Upload Playwright report
      if: always() && steps.guard.outputs.configured == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: playwright-report-staging
        path: playwright-report/
        retention-days: 14
