name: Authenticated staging E2E

on:
  workflow_dispatch:
  workflow_call:

# Manual/environment gate — not an automatic production promotion blocker.
# Requires GitHub environment `staging-e2e` secrets:
#   E2E_BASE_URL
#   E2E_RECRUITER_EMAIL
#   E2E_RECRUITER_PASSWORD
# MFA must be disabled only on this dedicated non-privileged test account.
# Application MFA policy is not changed by this workflow.

jobs:
  authenticated-e2e:
    runs-on: ubuntu-latest
    environment: staging-e2e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Require dedicated test-account secrets
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_RECRUITER_EMAIL: ${{ secrets.E2E_RECRUITER_EMAIL }}
          E2E_RECRUITER_PASSWORD: ${{ secrets.E2E_RECRUITER_PASSWORD }}
          E2E_WORKSPACE: ${{ secrets.E2E_WORKSPACE }}
        run: |
          set -euo pipefail
          if [ -z "${E2E_BASE_URL}" ] || [ -z "${E2E_RECRUITER_EMAIL}" ] || [ -z "${E2E_RECRUITER_PASSWORD}" ] || [ -z "${E2E_WORKSPACE}" ]; then
            echo "Missing staging-e2e secrets. Configure E2E_BASE_URL, E2E_WORKSPACE, E2E_RECRUITER_EMAIL, E2E_RECRUITER_PASSWORD."
            echo "Use a dedicated non-privileged recruiter with MFA disabled only on that account."
            exit 1
          fi
      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run authenticated staging specs
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_RECRUITER_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_RECRUITER_PASSWORD }}
          E2E_WORKSPACE: ${{ secrets.E2E_WORKSPACE }}
        run: npx playwright test --config=playwright.staging.config.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-staging-e2e
          path: playwright-report/
          retention-days: 7
