version: '3.8'

# ─── PRODUCTION ENVIRONMENT ─────────────────────────────────────────────────
# Image tag: ${RELEASE_SHA} immutable digest/tag. Never deploy application :latest.
# Portainer: deploy this as stack — project name MUST stay "aria" to preserve
# existing volumes (aria_postgres_data, aria_ollama_data, etc.)
# Staging stack: see docker-compose.staging.yml (separate project, tag: staging)
# ─────────────────────────────────────────────────────────────────────────────
name: aria

services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-screener-postgres
    # Tuned for 6 GB RAM allocation on a 48 GB server.
    command: >
      postgres
      -c shared_buffers=1536MB
      -c effective_cache_size=4GB
      -c work_mem=64MB
      -c maintenance_work_mem=256MB
      -c max_connections=200
      -c wal_buffers=64MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c log_min_duration_statement=1000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-aria_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 6G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aria} -d ${POSTGRES_DB:-aria_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: resume-screener-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  migrate:
    image: revanth2245/resume-backend:${RELEASE_SHA:?RELEASE_SHA must be set}
    container_name: resume-screener-migrate
    command: python -m app.backend.services.migration_owner
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aria}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aria_db}
      - RUN_DB_MIGRATIONS=1
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy

  db-backup:
    image: postgres:16-alpine
    container_name: resume-screener-db-backup
    profiles: ["backup"]
    entrypoint: ["/bin/sh", "/scripts/backup_postgres.sh"]
    environment:
      - PGHOST=postgres
      - PGUSER=${POSTGRES_USER:-aria}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB:-aria_db}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_ACCESS_KEY=${BACKUP_S3_ACCESS_KEY:-}
      - BACKUP_S3_SECRET_KEY=${BACKUP_S3_SECRET_KEY:-}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts:/scripts:ro
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    image: revanth2245/resume-backend:${RELEASE_SHA:?RELEASE_SHA must be set}
    container_name: resume-screener-worker
    command: python -m app.backend.worker
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aria}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aria_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be set}
      - ENVIRONMENT=production
      - RUN_BACKGROUND_WORKERS=1
      - RUN_DB_MIGRATIONS=0
      - ARIA_PROCESS_ROLE=worker
      - WORKER_DATABASE_POOL_SIZE=3
      - WORKER_DATABASE_MAX_OVERFLOW=2
      - REDIS_REQUIRED=1
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - S3_ENDPOINT=${S3_ENDPOINT:?S3_ENDPOINT must be set}
      - S3_BUCKET=${S3_BUCKET:-aria-files}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:31b-cloud}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - GEMINI_KIT_MODEL=${GEMINI_KIT_MODEL:-}
      - GEMINI_NARRATIVE_MODEL=${GEMINI_NARRATIVE_MODEL:-}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-2}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-ARIA Resume Screener}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.backend.worker_healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  ollama:
    profiles: ["local-ollama"]
    image: ollama/ollama:latest
    container_name: resume-screener-ollama
    environment:
      # CPU inference: use all 8 allocated cores for maximum token throughput.
      - OLLAMA_NUM_THREAD=8
      # Allow 4 concurrent LLM requests — 3-stage pipeline fires up to 2 nodes
      # simultaneously; the extra slot handles SSE streaming overlap.
      - OLLAMA_NUM_PARALLEL=4
      # Only one model now — no need to keep multiple slots hot.
      - OLLAMA_MAX_LOADED_MODELS=1
      # Flash Attention: fused attention kernel, 20-40% faster on longer contexts.
      - OLLAMA_FLASH_ATTENTION=1
      # Quantise KV cache to int8 — halves RAM per-slot, allows higher parallelism.
      - OLLAMA_KV_CACHE_TYPE=q8_0
      # Keep model always hot in RAM (-1 = never unload)
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '8'
          # Model memory estimate: weights + KV-cache + compute headroom
          # 8 GB gives headroom for OS overhead and concurrent requests.
          memory: 8G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Rebuild/push the backend image from app/backend/Dockerfile so ENTRYPOINT includes
  # wait_for_ollama.py (Ollama healthy + model warm before uvicorn).
  backend:
    image: revanth2245/resume-backend:${RELEASE_SHA:?RELEASE_SHA must be set}
    container_name: resume-screener-backend
    # 4 workers: backend is I/O-bound (waits on Ollama/DB), so multiple workers
    # serve concurrent users without starving Ollama of CPU cores.
    command: uvicorn app.backend.main:app --host 0.0.0.0 --port 8000 --workers 6 --timeout-graceful-shutdown 30
    # Give the backend time to finish background tasks (sentinel) on shutdown
    stop_grace_period: 60s
    environment:
      # Ollama Cloud (default): https://ollama.com — get API key from https://ollama.com/settings/keys
      # For local Ollama, set OLLAMA_BASE_URL=http://ollama:11434 in your .env file
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - GEMINI_KIT_MODEL=${GEMINI_KIT_MODEL:-}
      - GEMINI_NARRATIVE_MODEL=${GEMINI_NARRATIVE_MODEL:-}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-2}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-ARIA Resume Screener}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:?OLLAMA_API_KEY is required. Get it from https://ollama.com/settings/keys}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aria}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aria_db}
      # Read replica URL for scaling read operations (optional - leave empty if not using replicas)
      - DATABASE_READ_REPLICA_URL=${DATABASE_READ_REPLICA_URL:-}
      # PgBouncer connection pool settings for high concurrency
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-3}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-2}
      - RUN_DB_MIGRATIONS=0
      - REDIS_REQUIRED=1
      - ARIA_PROCESS_ROLE=api
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be set}
      - ENVIRONMENT=production
      # Using gemma4:31b-cloud - powerful multimodal model with strong reasoning
      # Excellent for video malpractice detection, resume analysis, and transcript evaluation
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:31b-cloud}
      # 500s recommended for gemma4:31b-cloud (faster than 480B models)
      - LLM_NARRATIVE_TIMEOUT=${LLM_NARRATIVE_TIMEOUT:-500}
      # Backend entrypoint waits for Ollama + pulls model into RAM before uvicorn.
      # Automatically skipped when using Ollama Cloud.
      - OLLAMA_STARTUP_REQUIRED=${OLLAMA_STARTUP_REQUIRED:-1}
      # Object Storage (S3/MinIO) for file storage
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-aria-files}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_SSL=${S3_USE_SSL:-true}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - RUN_BACKGROUND_WORKERS=0
      - CLAMAV_REQUIRED=1
      - CLAMAV_HOST=${CLAMAV_HOST:-clamav}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G
        reservations:
          cpus: '2'
          memory: 4G
      # Update config for rolling updates
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      # Restart policy
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: revanth2245/resume-frontend:${RELEASE_SHA:?RELEASE_SHA must be set}
    container_name: resume-screener-frontend
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  nginx:
    image: revanth2245/resume-nginx:${RELEASE_SHA:?RELEASE_SHA must be set}
    container_name: resume-screener-nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    # Allow nginx to reach host ports (e.g. staging nginx on 8081)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Graceful shutdown for zero-downtime deployment
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Runs once after Ollama is healthy, loads model into RAM so the
  # first real analysis request is never blocked by a cold-start.
  # Exits after warmup — OLLAMA_KEEP_ALIVE=-1 on ollama container keeps model loaded.
  ollama-warmup:
    profiles: ["local-ollama"]
    image: ollama/ollama:latest
    container_name: resume-screener-ollama-warmup
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        echo '============================================';
        echo '  ARIA — Ollama Model Warmup';
        echo '============================================';
        echo '';
        echo '  Waiting for Ollama...';
        until ollama list > /dev/null 2>&1; do
          echo '  Waiting for Ollama...';
          sleep 3;
        done;
        echo '  ✓  Ollama is up';
        echo '';
        echo \"  Loading $${OLLAMA_MODEL} into RAM...\";
        ollama run $${OLLAMA_MODEL} 'warmup' --nowordwrap;
        echo \"  ✓  $${OLLAMA_MODEL} is HOT in RAM\";
        echo '  ✓  Warmup complete — exiting (KEEP_ALIVE=-1 keeps model loaded)';
        echo '============================================';
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:31b-cloud}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    restart: "no"

  # Watchtower: polls Docker Hub for updated images of ARIA containers.
  #
  # PRODUCTION SAFETY: by default this runs in MONITOR-ONLY mode
  # (WATCHTOWER_MONITOR_ONLY=true) — it detects and logs/notifies about new
  # images but does NOT auto-restart containers. This is the approval gate:
  # an operator promotes a release by pulling and recreating the stack, e.g.
  #     docker compose -f docker-compose.prod.yml pull
  #     docker compose -f docker-compose.prod.yml up -d
  # To restore fully-automatic production deploys, set
  # WATCHTOWER_MONITOR_ONLY=false in the environment. Configure
  # WATCHTOWER_NOTIFICATION_URL (shoutrrr) to receive update notifications.
  # Monitors only ARIA containers so it doesn't touch other stacks on the VPS.
  watchtower:
    image: containrrr/watchtower
    container_name: resume-screener-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      --rolling-restart
      --interval 60
      --cleanup
      resume-screener-backend
      resume-screener-frontend
      resume-screener-nginx
      resume-screener-speech-service
      resume-screener-voice-agent
      resume-screener-livekit
    environment:
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_NO_PULL=false
      - WATCHTOWER_MONITOR_ONLY=${WATCHTOWER_MONITOR_ONLY:-true}
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL:-}
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: resume-screener-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"
    restart: unless-stopped

  # ─── Voice Screening Services ────────────────────────────────────────────────

  # LiveKit Server — WebRTC SFU + SIP trunking for voice calls.
  # ~1 GB RAM. Handles outbound PSTN calls and inbound call routing.
  livekit:
    image: revanth2245/resume-livekit:${RELEASE_SHA:?RELEASE_SHA must be set}
    container_name: resume-screener-livekit
    command: >
      --config /etc/livekit.yaml
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
      - LIVEKIT_REDIS_ADDRESS=redis:6379
      - LIVEKIT_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - LIVEKIT_REDIS_DB=1
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7880:7880"   # WebSocket
      - "7881:7881"   # RTC
      - "7882:7882/udp"  # TURN
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Speech Service — Parakeet TDT (STT) + Kokoro 82M (TTS) + Silero VAD.
  # ~4 GB RAM. CPU-only inference.
  speech-service:
    image: revanth2245/resume-speech-service:${RELEASE_SHA:?RELEASE_SHA must be set}
    container_name: resume-screener-speech-service
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    restart: unless-stopped

  # Voice Agent — LiveKit Agents process for conversation orchestration.
  # ~2 GB RAM. Connects to LiveKit + Speech Service + Ollama Cloud.
  voice-agent:
    image: revanth2245/resume-voice-agent:${RELEASE_SHA:?RELEASE_SHA must be set}
    container_name: resume-screener-voice-agent
    environment:
      - SPEECH_SERVICE_URL=http://speech-service:8001
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://ollama.com}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:31b-cloud}
      - ARIA_BACKEND_URL=http://backend:8000
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be set}
    depends_on:
      livekit:
        condition: service_healthy
      speech-service:
        condition: service_started
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    restart: unless-stopped

  # Official ClamAV daemon — required by backend CLAMAV_REQUIRED=1
  clamav:
    image: clamav/clamav:1.4
    container_name: resume-screener-clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

volumes:
  ollama_data:
  postgres_data:
  redis_data:
  backup_data:
  clamav_data:
  certbot_certs:
  certbot_www:

networks:
  default:
    name: aria_network
    driver: bridge
